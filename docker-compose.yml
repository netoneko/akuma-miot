# A litter of five containers on one network.
#
# This is the shape that `miot-sim` only pretended to be. There, four cats were
# four integers inside one process sharing one in-memory state machine. Here
# each cat is its own container that has never heard of the others: everything
# it knows about them arrives as an event from the node, which keeps the
# litter's oldest rule intact — the chain is the only channel between agents.
#
#   node   owns the chain. Ticks blocks on its own clock, forever, whether or
#          not any cat is connected. Law I, as a separate process.
#   mimi   leader.  tama / kuro / sora  workers.
#
# The MODELS stay on the HOST: Docker Desktop on macOS has no GPU passthrough,
# so a llama-server in a container is CPU-only and 5-10x slower. Start them with
#   overlays/local/llama-swarm.sh up
# and the cats reach them at host.docker.internal.
services:
  node:
    image: akuma-miot:net
    command: miot-node
    environment:
      MIOT_PORT: "9944"
      MIOT_ROOT: "1"
      MIOT_LEADER: "2"
    ports:
      - "9944:9944"          # talk to the chain from your terminal

  mimi:
    image: akuma-miot:net
    command: miot-cat
    depends_on: [node]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MIOT_NAME: mimi
      MIOT_ID: "2"
      MIOT_NODE: http://node:9944
      MIOT_LLM: http://host.docker.internal:8081
      MIOT_MODEL: qwen3:4b
      MIOT_PERSONA: /personas/mimi.md

  tama:
    image: akuma-miot:net
    command: miot-cat
    depends_on: [node]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MIOT_NAME: tama
      MIOT_ID: "3"
      MIOT_NODE: http://node:9944
      MIOT_LLM: http://host.docker.internal:8082
      MIOT_MODEL: qwen3:4b
      MIOT_PERSONA: /personas/tama.md

  kuro:
    image: akuma-miot:net
    command: miot-cat
    depends_on: [node]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MIOT_NAME: kuro
      MIOT_ID: "4"
      MIOT_NODE: http://node:9944
      MIOT_LLM: http://host.docker.internal:8083
      MIOT_MODEL: qwen3:4b
      MIOT_PERSONA: /personas/kuro.md

  sora:
    image: akuma-miot:net
    command: miot-cat
    depends_on: [node]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MIOT_NAME: sora
      MIOT_ID: "5"
      MIOT_NODE: http://node:9944
      MIOT_LLM: http://host.docker.internal:8084
      MIOT_MODEL: qwen3:4b
      MIOT_PERSONA: /personas/sora.md
