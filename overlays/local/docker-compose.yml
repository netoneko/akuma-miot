# A litter of six containers on one network.
#
# This is the shape that `miot-sim` only pretended to be. There, four cats were
# four integers inside one process sharing one in-memory state machine. Here
# each cat is its own container that has never heard of the others: everything
# it knows about them arrives as an event from the node, which keeps the
# litter's oldest rule intact — the chain is the only channel between agents.
#
#   node   owns the chain. Ticks blocks on its own clock, forever, whether or
#          not any cat is connected. Law I, as a separate process.
#   node2  a read replica of `node` (HANDOFF item 5) — pulls its block log
#          over HTTP, produces none of its own, no cat talks to it.
#   mimi   leader.  tama / kuro / sora  workers.
#
# The MODELS stay on the HOST: Docker Desktop on macOS has no GPU passthrough,
# so a llama-server in a container is CPU-only and 5-10x slower. Start them with
#   overlays/local/llama-swarm.sh up
# and the cats reach them at host.docker.internal.
#
# Every act on the chain is a signed extrinsic now — there is no more `who`
# field the node just trusted. MIOT_SEED is each cat's identity (a small int
# is a deterministic ed25519 seed, [n;32] — fine for one operator's own
# trusted litter; 64 hex chars is a real seed). The node's own defaults
# already fall back to seed 1 (root) and seed 2 (leader) when MIOT_ROOT/
# MIOT_LEADER aren't set, so this compose file doesn't need to spell them —
# and MIOT_MEMBERS defaults to 1,2,3,4,5, which is exactly this roster.
services:
  node:
    image: akuma-miot:net
    command: miot-node
    environment:
      MIOT_PORT: "9944"
      MIOT_DB: /data/miot.db
    volumes:
      - node-db:/data         # survives `up -d --force-recreate`; `down -v` to reset
    ports:
      - "9944:9944"          # talk to the chain from your terminal

  # A passive read replica — HANDOFF item 5. No cat points at it; its only
  # job is to prove `node`'s block log replicates over HTTP. It pulls
  # `node`'s blocks itself (`MIOT_ROLE=replica`/`MIOT_PEER`, see
  # `crates/miot-node/src/main.rs`'s `sync_once`) rather than being told
  # about them, and refuses `/submit` — read from it (`curl
  # localhost:9945/tasks`), don't write to it.
  node2:
    image: akuma-miot:net
    command: miot-node
    depends_on: [node]
    environment:
      MIOT_PORT: "9944"
      MIOT_DB: /data/miot.db
      MIOT_ROLE: replica
      MIOT_PEER: http://node:9944
    volumes:
      - node2-db:/data
    ports:
      - "9945:9944"          # compare against `node` by hand: curl localhost:9945/tasks

  mimi:
    image: akuma-miot:net
    command: miot-cat
    depends_on: [node]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MIOT_NAME: mimi
      MIOT_SEED: "2"
      MIOT_NODE: http://node:9944
      MIOT_LLM: http://host.docker.internal:8081
      MIOT_MODEL: qwen3:4b
      MIOT_PERSONA: /personas/mimi.md

  tama:
    image: akuma-miot:net
    command: miot-cat
    depends_on: [node]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MIOT_NAME: tama
      MIOT_SEED: "3"
      MIOT_NODE: http://node:9944
      MIOT_LLM: http://host.docker.internal:8082
      MIOT_MODEL: qwen3:4b
      MIOT_PERSONA: /personas/tama.md

  kuro:
    image: akuma-miot:net
    command: miot-cat
    depends_on: [node]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MIOT_NAME: kuro
      MIOT_SEED: "4"
      MIOT_NODE: http://node:9944
      MIOT_LLM: http://host.docker.internal:8083
      MIOT_MODEL: qwen3:4b
      MIOT_PERSONA: /personas/kuro.md

  sora:
    image: akuma-miot:net
    command: miot-cat
    depends_on: [node]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MIOT_NAME: sora
      MIOT_SEED: "5"
      MIOT_NODE: http://node:9944
      MIOT_LLM: http://host.docker.internal:8084
      MIOT_MODEL: qwen3:4b
      MIOT_PERSONA: /personas/sora.md

volumes:
  node-db:
  node2-db:
