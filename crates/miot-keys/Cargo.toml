[package]
name = "miot-keys"
description = "Cat identity — the operator's SSH key as a Substrate account"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# No `ed25519-dalek`, no hand-rolled signing envelope. polkadot-sdk is already
# pulled, and it has all of this: `ed25519::Pair` for keys, `AccountId32` for
# accounts, `MultiSignature` for signatures, and `UncheckedExtrinsic` plus the
# `frame-system` transaction extensions for everything a signed call needs.
#
# What is left here is the one thing polkadot-sdk does NOT have: reading an
# OpenSSH `authorized_keys` line, so the operator's identity is the key they
# already use to reach the machine rather than a new secret.
[dependencies]
polkadot-sdk = { workspace = true, default-features = true, features = ["sp-core", "sp-runtime"] }
base64 = "0.22"

[dev-dependencies]
hex = "0.4"
