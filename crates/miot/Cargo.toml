[package]
name = "miot"
description = "The litter's binary: a chain node (`miot node`), or an RPC client of one (`miot --rpc <url>`, one-shot or --repl)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "miot"
path = "src/main.rs"

[dependencies]
polkadot-sdk = { workspace = true, default-features = true, features = ["frame-support", "frame-system", "sp-io", "sp-runtime", "sp-core", "sp-storage"] }
codec = { package = "parity-scale-codec", version = "3", features = ["std"] }
miot-primitives = { workspace = true, features = ["codec"] }
miot-runtime = { path = "../miot-runtime" }
miot-keys = { path = "../miot-keys" }
miot-store = { path = "../miot-store" }
pallet-litter = { path = "../pallet-litter" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
getrandom = "0.2"
