[package]
name = "miot"
description = "The litter's binary: an in-process demo/live/chat harness, and (--rpc) a signing client of a real node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "miot"
path = "src/main.rs"

[dependencies]
polkadot-sdk = { workspace = true, default-features = true, features = [
  "frame-support", "frame-system", "sp-io", "sp-runtime", "sp-core",
] }
miot-primitives = { workspace = true, features = ["codec"] }
miot-runtime = { path = "../miot-runtime" }
miot-keys = { path = "../miot-keys" }
pallet-litter = { path = "../pallet-litter" }
miot-llm = { path = "../miot-llm" }
codec = { package = "parity-scale-codec", version = "3", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde_json = "1"
hex = "0.4"
getrandom = "0.2"
