[package]
name = "miot-runtime"
description = "The Akuma Miot runtime — FRAME, executed natively. No wasm."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# No `substrate-wasm-builder`, no build.rs, no wasm target.
#
# The blob exists in Substrate to be swapped on chain for a forkless upgrade.
# We do not upgrade, and we do not run `sc-service`, so we execute the runtime
# as what it already is: ordinary compiled Rust. FRAME's runtime side is a
# library; the wasm requirement comes entirely from the node.
#
# The upgrade path stays open precisely because nothing here is unusual: add
# `substrate-wasm-builder` and `impl_runtime_apis!` later and this same runtime
# compiles to a blob.
[dependencies]
codec = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }
polkadot-sdk = { workspace = true, features = [
  "frame-executive", "frame-support", "frame-system",
  "sp-core", "sp-io", "sp-runtime", "sp-version",
] }
miot-primitives = { workspace = true, features = ["codec"] }
pallet-litter = { path = "../pallet-litter", default-features = false }
# Only for the `client` module (signing) — always std, same as `miot-node`'s
# own dependency on it, since nothing builds this crate for a `no_std` target
# today anyway (there is no wasm build).
miot-keys = { path = "../miot-keys" }

[features]
default = ["std"]
std = [
  "codec/std",
  "scale-info/std",
  "polkadot-sdk/std",
  "miot-primitives/std",
  "pallet-litter/std",
]
