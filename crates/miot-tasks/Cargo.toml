[package]
name = "miot-tasks"
description = "The Akuma Miot task lifecycle as a pure state machine — no I/O, no clock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
codec = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"], optional = true }
scale-info = { version = "2", default-features = false, features = ["derive"], optional = true }
miot-primitives = { workspace = true }

[features]
default = ["std"]
# SCALE encoding + type metadata. Off by default so the host test loop never
# pays for it; `pallet-litter` turns it on.
codec = ["dep:codec", "dep:scale-info", "miot-primitives/codec"]
std = ["miot-primitives/std", "codec?/std", "scale-info?/std"]
