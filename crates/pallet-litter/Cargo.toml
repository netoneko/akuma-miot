[package]
name = "pallet-litter"
description = "FRAME pallet wrapping the Akuma Miot task lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The polkadot-sdk umbrella rather than ~25 hand-matched `frame-*`/`sp-*`
# versions. Its deps are all optional, so naming features prunes the graph
# instead of pulling the whole SDK — and coherence across the release train
# stops being something anyone has to maintain by hand. One version to bump.
[dependencies]
codec = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }
polkadot-sdk = { workspace = true, features = ["frame-support", "frame-system", "sp-runtime"] }
miot-primitives = { workspace = true, features = ["codec"] }
miot-tasks = { workspace = true, features = ["codec"] }

[dev-dependencies]
polkadot-sdk = { workspace = true, default-features = true, features = ["frame-support", "frame-system", "sp-runtime", "sp-io", "sp-core"] }

[features]
default = ["std"]
std = [
  "codec/std",
  "scale-info/std",
  "polkadot-sdk/std",
  "miot-primitives/std",
  "miot-tasks/std",
]
