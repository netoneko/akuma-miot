[package]
name = "miot-cat"
description = "One cat. One container. Talks to the node over the network."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "miot-cat"
path = "src/main.rs"

[dependencies]
miot-llm = { path = "../miot-llm" }
miot-primitives = { workspace = true, features = ["codec"] }
miot-runtime = { path = "../miot-runtime" }
miot-keys = { path = "../miot-keys" }
pallet-litter = { path = "../pallet-litter" }
polkadot-sdk = { workspace = true, default-features = true, features = ["sp-core"] }
codec = { package = "parity-scale-codec", version = "3", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
