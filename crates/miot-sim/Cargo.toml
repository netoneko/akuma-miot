[package]
name = "miot-sim"
description = "Runs a litter end to end against the real runtime, natively"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "miot-sim"
path = "src/main.rs"

[dependencies]
polkadot-sdk = { workspace = true, default-features = true, features = [
  "frame-support", "frame-system", "sp-io", "sp-runtime",
] }
miot-primitives = { workspace = true, features = ["codec"] }
miot-runtime = { path = "../miot-runtime" }
pallet-litter = { path = "../pallet-litter" }
miot-llm = { path = "../miot-llm" }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
