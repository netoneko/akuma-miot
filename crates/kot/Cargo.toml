[package]
name = "kot"
description = "The litter's one binary: a mesh node plus a cat's agent loop (`kot run`), and the operator's client of any node (`kot task`, `kot say`, bare `kot` for the REPL). Polish for \"cat\"."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kot"
path = "src/main.rs"

[dependencies]
polkadot-sdk = { workspace = true, default-features = true, features = ["frame-support", "frame-system", "sp-io", "sp-runtime", "sp-core", "sp-storage"] }
codec = { package = "parity-scale-codec", version = "3", features = ["std"] }
miot-primitives = { workspace = true, features = ["codec"] }
miot-runtime = { path = "../miot-runtime" }
miot-keys = { path = "../miot-keys" }
miot-store = { path = "../miot-store" }
miot-mesh = { path = "../miot-mesh" }
miot-llm = { path = "../miot-llm" }
pallet-litter = { path = "../pallet-litter" }
axum = { version = "0.8", features = ["http2"] }
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "io-std", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
x509-parser = "0.16"
getrandom = "0.2"
clap = { version = "4", features = ["derive", "env"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std", "scrolling-regions"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ansi-to-tui = "8.0.1"
ratatui-textarea = "0.9.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
